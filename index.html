<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ultimate Media Downloader</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    animation: {
                        'gradient-x': 'gradient-x 3s ease infinite',
                    },
                    keyframes: {
                        'gradient-x': {
                            '0%, 100%': {
                                'background-size': '200% 200%',
                                'background-position': 'left center'
                            },
                            '50%': {
                                'background-size': '200% 200%',
                                'background-position': 'right center'
                            },
                        }
                    }
                }
            }
        }
    </script>

    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-900 text-white min-h-screen font-sans antialiased selection:bg-fuchsia-500 selection:text-white">

    <div id="root"></div>

    <script type="text/babel">
        const { useState } = React;

        const App = () => {
            const [url, setUrl] = useState("");
            const [mediaType, setMediaType] = useState("video");
            const [loading, setLoading] = useState(false);
            const [error, setError] = useState(null);
            const [result, setResult] = useState(null);

            // Robust validation and submission handler
            const handleDownload = async (e) => {
                e.preventDefault();
                setError(null);
                setResult(null);

                // 1. Null / Empty Check
                if (!url || url.trim() === "") {
                    setError("Please enter a media link.");
                    return;
                }

                // 2. URL Format Validation
                let validUrl;
                try {
                    validUrl = new URL(url);
                } catch (err) {
                    setError("Invalid URL format. Please include http:// or https://");
                    return;
                }

                // 3. Start Loading State
                setLoading(true);

                /* * ---------------------------------------------------------
                 * BACKEND INTEGRATION POINT
                 * ---------------------------------------------------------
                 * This is where you would make a fetch() request to your 
                 * Node.js/Python backend. Since we are purely frontend here,
                 * we are simulating a network delay and returning a mock result.
                 */
                
                setTimeout(() => {
                    setLoading(false);
                    
                    // Simulating a successful backend response
                    setResult({
                        title: `Extracted ${mediaType.charAt(0).toUpperCase() + mediaType.slice(1)} File`,
                        source: validUrl.hostname,
                        downloadUrl: url, // In reality, this would be the actual file URL from your backend
                        size: "24.5 MB"
                    });
                }, 2500);
            };

            const clearInput = () => {
                setUrl("");
                setError(null);
                setResult(null);
            };

            return (
                <div class="flex flex-col items-center justify-center min-h-screen p-4 bg-gradient-to-br from-slate-900 via-purple-900 to-slate-900 animate-gradient-x">
                    
                    {/* Main UI Card */}
                    <div class="w-full max-w-xl bg-white/10 backdrop-blur-lg rounded-3xl shadow-2xl border border-white/20 p-8">
                        
                        {/* Header */}
                        <div class="text-center mb-8">
                            <h1 class="text-4xl font-extrabold text-transparent bg-clip-text bg-gradient-to-r from-fuchsia-400 to-cyan-400 mb-2">
                                OmniLoad
                            </h1>
                            <p class="text-slate-300 text-sm">The ultimate video, audio, and image fetcher.</p>
                        </div>

                        {/* Form */}
                        <form onSubmit={handleDownload} class="space-y-6">
                            
                            {/* Type Selector */}
                            <div class="flex justify-center space-x-4 bg-black/20 p-2 rounded-xl">
                                {['video', 'audio', 'image'].map((type) => (
                                    <button
                                        key={type}
                                        type="button"
                                        onClick={() => setMediaType(type)}
                                        class={`flex-1 py-2 rounded-lg text-sm font-semibold transition-all duration-300 flex items-center justify-center gap-2 ${
                                            mediaType === type 
                                            ? 'bg-gradient-to-r from-fuchsia-500 to-cyan-500 text-white shadow-lg' 
                                            : 'text-slate-400 hover:text-white hover:bg-white/5'
                                        }`}
                                    >
                                        <i class={`fa-solid ${type === 'video' ? 'fa-video' : type === 'audio' ? 'fa-music' : 'fa-image'}`}></i>
                                        {type.charAt(0).toUpperCase() + type.slice(1)}
                                    </button>
                                ))}
                            </div>

                            {/* Input Field */}
                            <div class="relative">
                                <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
                                    <i class="fa-solid fa-link text-slate-400"></i>
                                </div>
                                <input 
                                    type="text" 
                                    value={url}
                                    onChange={(e) => {
                                        setUrl(e.target.value);
                                        if (error) setError(null);
                                    }}
                                    placeholder={`Paste your ${mediaType} link here...`}
                                    class="w-full pl-12 pr-10 py-4 bg-black/30 border border-slate-600 rounded-xl focus:outline-none focus:border-cyan-400 focus:ring-1 focus:ring-cyan-400 transition-all text-white placeholder-slate-500"
                                />
                                {url && (
                                    <button 
                                        type="button" 
                                        onClick={clearInput}
                                        class="absolute inset-y-0 right-0 pr-4 flex items-center text-slate-400 hover:text-white transition-colors"
                                    >
                                        <i class="fa-solid fa-times-circle"></i>
                                    </button>
                                )}
                            </div>

                            {/* Error Message */}
                            {error && (
                                <div class="flex items-center gap-2 text-red-400 bg-red-400/10 p-3 rounded-lg text-sm border border-red-400/20">
                                    <i class="fa-solid fa-circle-exclamation"></i>
                                    {error}
                                </div>
                            )}

                            {/* Submit Button */}
                            <button 
                                type="submit" 
                                disabled={loading}
                                class="w-full py-4 rounded-xl font-bold text-lg bg-gradient-to-r from-cyan-500 to-blue-500 hover:from-cyan-400 hover:to-blue-400 text-white shadow-[0_0_20px_rgba(6,182,212,0.4)] transition-all duration-300 disabled:opacity-50 disabled:cursor-not-allowed flex justify-center items-center gap-2"
                            >
                                {loading ? (
                                    <>
                                        <i class="fa-solid fa-circle-notch fa-spin"></i> Processing...
                                    </>
                                ) : (
                                    <>
                                        <i class="fa-solid fa-cloud-arrow-down"></i> Fetch Media
                                    </>
                                )}
                            </button>
                        </form>

                        {/* Results Area */}
                        {result && (
                            <div class="mt-8 p-6 bg-black/40 rounded-xl border border-green-400/30 animate-fade-in-up">
                                <div class="flex items-start justify-between">
                                    <div>
                                        <h3 class="text-green-400 font-bold mb-1 flex items-center gap-2">
                                            <i class="fa-solid fa-check-circle"></i> Ready to Download
                                        </h3>
                                        <p class="text-slate-300 text-sm font-medium">{result.title}</p>
                                        <p class="text-slate-500 text-xs mt-1">Source: {result.source} • Size: {result.size}</p>
                                    </div>
                                    <div class="text-3xl text-cyan-400">
                                        <i class={`fa-solid ${mediaType === 'video' ? 'fa-file-video' : mediaType === 'audio' ? 'fa-file-audio' : 'fa-file-image'}`}></i>
                                    </div>
                                </div>
                                
                                <a 
                                    href={result.downloadUrl} 
                                    target="_blank" 
                                    rel="noopener noreferrer"
                                    class="mt-4 w-full block text-center py-3 bg-white/10 hover:bg-white/20 border border-white/20 rounded-lg font-semibold text-white transition-colors"
                                >
                                    Download File
                                </a>
                            </div>
                        )}
                    </div>
                    
                    <p class="mt-8 text-slate-500 text-xs text-center max-w-md">
                        Note: To actually extract files from platforms like YouTube, this frontend needs to be connected to a backend processing server.
                    </p>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
